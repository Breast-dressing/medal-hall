name: Doctor
on: workflow_dispatch
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: Toolchain
        run: |
          set -x
          xcodebuild -version
          xcode-select -p
          ls /Applications | grep -i xcode
          xcodebuild -showsdks | grep -i -E 'iphoneos|simulator' || true
          xcrun simctl list runtimes
          sw_vers
